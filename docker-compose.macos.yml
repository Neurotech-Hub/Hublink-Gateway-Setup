services:
  hublink-gateway:
    image: ${GATEWAY_IMAGE:-public.ecr.aws/k3u6u5c1/hublink/gateway}:${GATEWAY_TAG:-canary}
    restart: always
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - ALL
    ports:
      - "6000:5000"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${LOCAL_STORAGE_PATH}:${LOCAL_STORAGE_PATH}
      - /Volumes:/Volumes:rw
      - /dev/bus/usb:/dev/bus/usb:ro
      - /var/run/dbus:/var/run/dbus
      - /var/run/bluetooth:/var/run/bluetooth
    environment:
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH}
      - MEDIA_STORAGE_PATH=/Volumes/HUBLINK
      - ENVIRONMENT=dev
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
