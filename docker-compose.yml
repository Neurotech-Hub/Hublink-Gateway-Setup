# Gateway rings (plan WP7): the image tag is pinned per ring in .env
# (GATEWAY_TAG=stable by default; GATEWAY_TAG=canary on the lab Pi). Watchtower's
# hourly `:latest` pull is gone: a new build reaches a Pi only when its ring's tag
# is moved and the Pi runs `docker-compose pull && docker-compose up -d`
# (see README "Rings").
services:
  hublink-gateway:
    image: ${GATEWAY_IMAGE:-public.ecr.aws/k3u6u5c1/hublink/gateway}:${GATEWAY_TAG:-stable}
    restart: always
    privileged: true
    network_mode: host
    stop_grace_period: 30s
    stop_signal: SIGTERM
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${LOCAL_STORAGE_PATH}:${LOCAL_STORAGE_PATH}
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - /media:/media:rshared
      - /var/run/dbus:/var/run/dbus
      - /var/run/bluetooth:/var/run/bluetooth
    environment:
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH}
      - MEDIA_STORAGE_PATH=/media/${USER}/HUBLINK
      - ENVIRONMENT=prod
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
